[package]
name = "kagiboy-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "kagiboy cartridge wallet logic: the Game Boy mailbox, PIN, keys, transaction decoding and signing (no_std)"

[dependencies]
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha3 = { version = "0.10", default-features = false }
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
ed25519-dalek = { version = "2", default-features = false }
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }
zeroize = { version = "1", default-features = false, features = ["derive", "alloc"] }

[dev-dependencies]
serde_json = "1"
hex = "0.4"
